<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- macOS icon grid: 824×824 tile centred on a 1024 canvas, room for the shadow. -->
  <defs>
    <linearGradient id="tile" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C2C31"/>
      <stop offset="1" stop-color="#0F0F11"/>
    </linearGradient>
    <linearGradient id="rim" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" stroke="url(#rim)" stroke-width="2"/>
  <rect x="325" y="332" width="309" height="40" rx="20" fill="#FFFFFF"/>
  <rect x="325" y="428" width="245" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.6"/>
  <rect x="325" y="525" width="180" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.4"/>
  <rect x="325" y="621" width="116" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.2"/>
</svg>
