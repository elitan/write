[package]
name = "write"
version = "0.1.0"
description = "Fast, minimal markdown notes"
authors = ["elitan"]
edition = "2021"

[lib]
name = "write_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
trash = "5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
